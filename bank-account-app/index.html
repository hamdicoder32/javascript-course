<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank-Account-App</title>
    <!-- fontawsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- css stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- welcome screen -->
      <div class="welcome">
        <div class="logo">
          <span><i class="fa-solid fa-building-columns"></i></span>
          <h1>MY BANK</h1>
        </div>

        <p>Welcome to My Bank</p>
        <button id="createbtn" class="create-btn">Create Account</button>
      </div>

      <!-- create account screen -->
      <div class="account-form">
        <h2>Create Your Account</h2>
        <form>
          <div class="group-form">
            <label for="name"> Full Name:</label>
            <input type="text" id="name" required />
          </div>

          <div class="group-form">
            <label for="email">Email:</label>
            <input type="email" id="email" required />
          </div>
          <button type="submit" id="createBtn">Create Account</button>
          <button type="button" id="cancelbtn">Cancel</button>
        </form>
      </div>

      <!-- succes page -->
      <div class="success">
        <h2>Account Created Successfully! ✅</h2>
        <p>Your account number: <span class="account-NO"></span></p>
        <button type="button" id="continuebtn">Continue</button>
      </div>

      <!-- dashbord -->
      <div class="dashboard">
        <p class="userName">Welcome, Math</p>
        <p class="userEmail">Email: math@email.com</p>
        <p>Account Number: <span id="account-NO">123456</span></p>
        <span class="balance"> Balance: $0</span>
        <div class="btn">
          <button type="button" id="depositbtn">Deposit</button>
          <button type="button" id="withdrawbtn">Withdraw</button>
        </div>

        <div class="transactions">
          <h2>Transaction History</h2>

          <div id="transaction-list"></div>
        </div>
        <button type="button" id="deleteBtn">Delete Account</button>
        
      </div>

      <!-- deposit page-->
      <div class="deposit-page">
        <h2>Deposit Money💸</h2>
        <div class="deposit-form">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" min="0" step="0.01" />
        </div>

        <div class="Btn">
          <button type="button" id="depositBtn">Deposit</button>
          <button type="button" id="cancelBtn">Cancel</button>
        </div>
        <p class="deposit-error"></p>
      </div>

      <!-- withdrawal page form -->

      <div class="withdraw-page">
        <h2>Withdrawal Money 💰</h2>
        <div class="withdraw-form">
          <label for="amount">Amount:</label>
          <input type="number" id="withdrawal-amount" min="0" step="0.01" />
        </div>

        <div class="Btn">
          <button type="button" id="withdrawalBtn">Withdrawal</button>
          <button type="button" id="cancel-btn">Cancel</button>
        </div>
        <p class="withdraw-error"></p>
      </div>
    </div>

    <!-- js -->
    <script src="script.js"></script>
  </body>
</html>
