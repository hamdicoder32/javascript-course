<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URBAN STYLE | Store</title>
    <!-- fiveicon -->
    <!-- css file -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- fontawsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header start -->
    <header>
      <!-- top header -->
      <div class="top-header">
        <div class="container">
          <a href="#" class="logo">MY SHOP</a>

          <form class="search-box">
            <select class="category">
              <option value="All category">All category</option>
              <option value="Computers">Computers</option>
              <option value="Phones">Phones</option>
              <option value="Watches">Watches</option>
            </select>
            <input type="search" placeholder="Search products.." />
            <button type="submit">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>

          <div class="actions header-icons">
            <div class="icon account">
              <i class="fa-regular fa-user"></i>
            </div>
            <div class="icon favorate">
              <i class="fa-regular fa-heart"></i>
              <span class="count count-favorate">0</span>
            </div>
            <div class="icon cart">
              <i class="fa-solid fa-cart-shopping"></i>
              <span class="count count-items">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- nabar -->
      <div class="header-botton">
        <div class="container">
          <div class="category">
            <div class="category-icon">
              <i class="fa-solid fa-bars"></i>
              <span>Browse products</span>
            </div>

            <div class="category-lists">
              <a href="#">All category</a>
              <a href="#">Computers</a>
              <a href="#">Phones</a>
              <a href="#">Watches</a>
            </div>
          </div>
          <!-- navigation -->
          <nav class="navbar">
            <ul>
              <li><a href="#">Home</a></li>
              <li><a href="#">Shop</a></li>
              <li><a href="#">New arivels</a></li>
              <li><a href="#">About</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
          </nav>
          <div class="hamburger">
            <i class="fa-solid fa-bars active"></i>
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
      </div>
    </header>
    <!-- header end -->
     <!-- js -->
      <script src="js/main.js"></script>
  </body>
</html>
